            }
          }
          Get-PSDrive C | Select-Object Used,Free

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (registry + git + target, pruned)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: cli-${{ matrix.os }}-v4
          # CI-B 根因修复(reports/2026-06-26-ci-B-rootcause.md):ort/sherpa
          # 的 dylib 落 ~/.cache(非 target/),须随 target 同缓存,否则
          # build-script fingerprint 命中→跳过下载→链接缺库。v3→v4 强制重建。
          cache-directories: |
            ~/.cache/ort.pyke.io
            ~/.cache/sherpa-rs

      - name: cargo test -p attune-cli -p attune-agent-sdk
        working-directory: rust
        run: cargo test -p attune-cli -p attune-agent-sdk --release

  rust-clippy:
    # Lint as its own parallel job (was an inline non-blocking step). Stays
    # non-blocking (continue-on-error) to preserve prior behavior — the Python
    # prototype line + Rust workspace lint is advisory, not a PR hard-gate here.
    runs-on: ubuntu-latest
    name: rust-clippy
    timeout-minutes: 50
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "false"
      CARGO_NET_RETRY: "10"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (ubuntu — reclaim ~25-30G before the release build)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo (registry + git + target, pruned)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: clippy-ubuntu-latest-v4
          # CI-B 根因修复(reports/2026-06-26-ci-B-rootcause.md):ort/sherpa
          # 的 dylib 落 ~/.cache(非 target/),须随 target 同缓存,否则
          # build-script fingerprint 命中→跳过下载→链接缺库。v3→v4 强制重建。
          cache-directories: |
            ~/.cache/ort.pyke.io
            ~/.cache/sherpa-rs

      - name: cargo clippy (non-blocking)
        working-directory: rust
        run: cargo clippy --workspace --release -- -D warnings
        continue-on-error: true

  cargo-audit:
    # Security: run cargo audit + cargo deny on every push/PR.
    # rustsec/audit-check caches advisory-db; cargo-deny checks licenses + bans.
    # No untrusted input used in run: steps.
    runs-on: ubuntu-latest
    # rustsec/audit-check@v2 posts findings as a GitHub Check Run (POST /repos/.../check-runs);
    # needs checks:write. contents:read keeps the rest of the job least-privilege.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-audit-v1-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-audit-v1-

      - name: cargo audit (RUSTSEC vulnerability scan)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rust

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: cargo deny check (licenses + bans + sources)
        working-directory: rust
        run: cargo deny check

  secret-scan:
    # Security (CLAUDE.md §1.4): gitleaks secret scan over commit history + tree.
    # Policy: .gitleaks.toml (history is clean — 983 commits, 0 real secrets;
    # allowlist covers gitignored working files, third-party test corpus, the
    # Ed25519 *public* verify key, and explicit test-stub literals). Mirrors
    # attune-pro's secret-scan job. No untrusted input is used in run: steps.
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks scans every commit, not just HEAD.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repo-local config (.gitleaks.toml) is auto-detected by the action.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  coverage:
    # Code coverage REPORTING (cargo-llvm-cov). REPORT-ONLY on day one — measures
    # a baseline and uploads lcov + summary as artifacts; NOT a blocking gate
    # (no --fail-under). A conservative ratchet floor can be turned on once the
    # baseline is observed across a few runs. Mirrors attune-pro's coverage job.
    # attune is a self-contained workspace (no sibling checkout needed). --release
    # keeps link memory in check; the workspace pulls wasmtime/onnx/tantivy/
    # usearch so the build is heavy — free disk up front like the test jobs.
    name: Coverage (report-only)
    runs-on: ubuntu-latest
    # The instrumented (-C instrument-coverage) full-workspace --release build is
    # far heavier than a normal build and hit the 60min wall still compiling on
    # run 27241292586. 90min clears it. Report-only (no --fail-under), so this gate
    # never blocks a PR on coverage numbers — only on the job completing.
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "10"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (reclaim ~25-30G before the coverage build)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: coverage-v1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage (lcov + summary)
        working-directory: rust
        # Run instrumented tests ONCE (--no-report keeps the profraw data), then
        # emit lcov + summary from that same run. #[ignore] slow E2E auto-skip
        # (same as the PR test jobs). Write lcov to an absolute path so the
        # upload step can't miss it.
        run: |
          cargo llvm-cov --workspace --release --no-report
          cargo llvm-cov report --release --lcov --output-path "$GITHUB_WORKSPACE/lcov.info"
          echo "## Coverage summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --release --summary-only >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -la "$GITHUB_WORKSPACE/lcov.info"

      - name: Upload coverage artifact (lcov)
        # Report-only gate: a flaky artifact upload must NEVER red-fail coverage.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: attune-coverage-lcov
          path: lcov.info
          retention-days: 30

  rust-test-slow-nightly:
    # R19 (2026-05-01): 慢 E2E 走 schedule 通道，每天 02:00 UTC 跑一次
    # form_factor_integration / system_wizard_full_flow_test / vault_setup_test (~6 min)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-v1-ubuntu-latest-${{ hashFiles('rust/Cargo.lock') }}
      - name: cargo test slow E2E (with --include-ignored)
        working-directory: rust
        run: cargo test --workspace --release -- --include-ignored

  test-floor:
    # W4 #93 — six-class test-floor guard. Mechanically enforces CLAUDE.md §6.1
    # 六类测试下限 + Agent 验证铁律 as a HARD PR gate, driven by the workspace
    # SSOT rust/agent_quality_manifest.yaml:
    #   • golden ≥ 10 per deterministic agent
    #   • NEW-AGENT guard — a tests/golden/<agent> dir with no manifest gate FAILS
    #     (a new agent must ship a gate + golden in the SAME PR)
    #   • docs/TESTING.md must still carry the A–K dimension matrix (release Gate anchor)
    # Pure bash (no toolchain / no network) — runs in seconds, complements the
    # deterministic agent_gate_orchestrator.rs ratchet (which runs inside
    # cargo test --workspace on rust-test-core). proptest/boundary/error counts
    # are reported as WARN (advisory) on day one; the structural checks above are HARD.
    name: Test-Floor Guard (six-class)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run six-class test-floor check (hard structural gate)
        run: bash scripts/test-floor-check.sh

  real-llm-secret-gated:
    # W4 #93 — secret-gated real-LLM N=3 gate (does NOT depend on the self-hosted
    # Ollama runner used by nightly-real-llm.yml). Runs the OSS doc-intel +
    # oss-agent real-LLM #[ignore] gates against a REAL OpenAI-compatible model
    # (DeepSeek / DashScope), N=3 seeds, hard floors per agent. Maps a CI secret
    # → the test's provider-agnostic env contract (ATTUNE_LLM_*). NO key is in
    # the repo (CLAUDE.md §1.4); the key is read ONLY from a GitHub Actions secret
    # and never echoed.
    #
    # SKIP-not-BLOCK: if neither DEEPSEEK_API_KEY nor DASHSCOPE_API_KEY is
    # configured, the job records PENDING and exits 0 (a fork / a repo without the
    # secret is never red-failed by a key it cannot have). Once the secret is set,
    # the floor (compare macro-F1 ≥ 0.80 etc., per doc_intel_real_llm_gate.rs) is
    # enforced — a real degradation fails the job (only-up ratchet, no goalposts).
    name: Real-LLM N=3 (secret-gated)
    runs-on: ubuntu-latest
    # Only on push/PR to the long-lived branches + manual; the Ollama lane owns
    # the nightly schedule. Light job (compile attune-core tests + N=3 API calls).
    if: github.event_name != 'schedule'
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "10"
      ATTUNE_REAL_LLM_SEEDS: "3"
    steps:
      - uses: actions/checkout@v4

      - name: Resolve LLM secret → provider env (skip if unset)
        id: keycheck
        # Map DEEPSEEK_API_KEY (preferred) or DASHSCOPE_API_KEY into the test's
        # ATTUNE_LLM_* contract. Secrets are referenced via env (never inlined in
        # run:), and the key is written to $GITHUB_ENV (masked) — never to a log.
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            {
              echo "ATTUNE_LLM_PROVIDER=openai_compat"
              echo "ATTUNE_LLM_ENDPOINT=https://api.deepseek.com/v1"
              echo "ATTUNE_LLM_API_KEY=${DEEPSEEK_API_KEY}"
              echo "ATTUNE_LLM_MODEL=deepseek-chat"
            } >> "$GITHUB_ENV"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "[real-llm] DeepSeek secret present — real-LLM N=3 gate WILL run."
          elif [ -n "${DASHSCOPE_API_KEY:-}" ]; then
            {
              echo "ATTUNE_LLM_PROVIDER=openai_compat"
              echo "ATTUNE_LLM_ENDPOINT=https://dashscope.aliyuncs.com/compatible-mode/v1"
              echo "ATTUNE_LLM_API_KEY=${DASHSCOPE_API_KEY}"
              echo "ATTUNE_LLM_MODEL=qwen-plus"
            } >> "$GITHUB_ENV"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "[real-llm] DashScope secret present — real-LLM N=3 gate WILL run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=real-llm-secret-gated::PENDING — no DEEPSEEK_API_KEY / DASHSCOPE_API_KEY secret configured; real-LLM N=3 gate SKIPPED (not a failure)."
          fi
          # Independent flag for the VISION real-VLM lane (#92): qwen3-vl needs the raw
          # DashScope key regardless of which TEXT provider was selected above.
          if [ -n "${DASHSCOPE_API_KEY:-}" ]; then
            echo "dashscope_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "dashscope_present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=vision-real-vlm::PENDING — no DASHSCOPE_API_KEY; vision real-VLM N=3 lane SKIPPED (not a failure)."
          fi

      - name: Free disk space
        if: steps.keycheck.outputs.configured == 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: dtolnay/rust-toolchain@stable
        if: steps.keycheck.outputs.configured == 'true'

      - name: Cache cargo
        if: steps.keycheck.outputs.configured == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: real-llm-secret-gated-v1

      - name: Build real-LLM gate tests
        if: steps.keycheck.outputs.configured == 'true'
        working-directory: rust
        run: cargo build -p attune-core --release --tests

      - name: Run OSS real-LLM N=3 gates (DeepSeek/DashScope)
        if: steps.keycheck.outputs.configured == 'true'
        id: gate
        working-directory: rust
        run: |
          set -o pipefail
          OUT="$RUNNER_TEMP/real-llm-secret.log"; : > "$OUT"
          rc=0
          # ATTUNE_LLM_* (incl. the masked key) come from $GITHUB_ENV set above;
          # ATTUNE_REAL_LLM_SEEDS=3 is the job-level env. Serial, single-thread.
          # ai_annotation_real_llm_gate (4 angles, micro-F1 floor 0.50) joined 2026-06-19:
          # it was OSS attune's weakest real-LLM gate (agent-capabilities.md §5.2 gap #1).
          for t in doc_intel_real_llm_gate oss_agent_real_llm_gate ai_annotation_real_llm_gate; do
            echo "=== $t (N=$ATTUNE_REAL_LLM_SEEDS) ===" | tee -a "$OUT"
            if ! cargo test -p attune-core --release --test "$t" \
                 -- real_llm --ignored --nocapture --test-threads=1 2>&1 | tee -a "$OUT"; then
              rc=1
            fi
          done
          {
            echo "## Real-LLM N=3 gate (secret-gated)"
            echo '```'
            grep -E "===|RESULT|macro-F1|floor|mean=" "$OUT" | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=real-llm-secret-gated::A real-LLM N=3 gate fell below its floor. Per Agent 验证铁律: raise the model tier in RELEASE.md or fix the prompt/schema — do NOT relax the floor."
          fi
          exit "$rc"

      # ── Vision real-VLM N=3 lane (#92), DashScope qwen3-vl-plus only ──
      # Runs the `vision-eval` feature's real-VLM #[ignore] tests (escalate → ground →
      # score, N=3) against a REAL qwen3 multimodal model. Independent of the text gate
      # above (it needs the raw DASHSCOPE_API_KEY → ATTUNE_VLM_API_KEY, not the text
      # ATTUNE_LLM_* env). SKIP-not-BLOCK: no DashScope secret → the keycheck recorded
      # PENDING and this step is skipped. Lands the §6.3 evidence the eprintln-only lane
      # never persisted (the "qwen3-vl-plus F1 1.0" claim).
      - name: Run vision real-VLM N=3 lane (DashScope qwen3-vl)
        if: steps.keycheck.outputs.dashscope_present == 'true'
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          ATTUNE_VLM_MODEL: qwen3-vl-plus
        working-directory: rust
        run: |
          set -o pipefail
          OUT="$RUNNER_TEMP/vision-real-vlm.log"; : > "$OUT"
          # DASHSCOPE_API_KEY comes from the step env (masked); the eval lane reads it
          # directly (qwen_vlm_from_env). Serial, single-thread. Floors are asserted
          # inside the tests (text-F1 ≥ 0.5, grounding-precision ≥ 0.99).
          if ! cargo test -p attune-core --release --features vision-eval --lib \
               -- real_vlm --ignored --nocapture --test-threads=1 2>&1 | tee -a "$OUT"; then
            echo "::error title=vision-real-vlm::Vision real-VLM N=3 lane fell below its floor. Per Agent 验证铁律: raise the VLM tier in RELEASE.md or fix grounding/prompt — do NOT relax the floor."
            exit 1
          fi
          {
            echo "## Vision real-VLM N=3 lane (qwen3-vl-plus)"
            echo '```'
            grep -E "real-VLM|text_f1|value_f1|grounding_prec|failover|test result:" "$OUT" | tail -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

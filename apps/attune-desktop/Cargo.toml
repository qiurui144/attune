# 独立 workspace：Cargo 不允许 workspace member 路径在 root 之上，
# 而 rust/Cargo.toml 是 root，apps/ 在它的同级。所以 attune-desktop
# 用自己的 workspace，通过 path 依赖 attune-server。
[workspace]

[package]
name = "attune-desktop"
version = "1.4.0"
edition = "2021"
rust-version = "1.75"
description = "Attune 桌面应用（Tauri 2 shell + 内嵌 attune-server）"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = { version = "2" }
tauri-plugin-single-instance = { version = "2" }
tauri-plugin-updater = { version = "2" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json"] }
# serde / serde_json: tauri::generate_context! 宏展开需要它们 (false-positive on cargo-machete)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
attune-server = { path = "../../rust/crates/attune-server" }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
# ── ONNX Runtime EP passthrough → attune-server → attune-core (默认全 OFF) ──
# desktop-release workflow 为 GPU 变体包传 `cargo tauri build --features <ep>`,
# 经此链式到 attune-core 的 ort/<ep>。默认 build 不开任一 EP = 纯 CPU 包(基础包不变)。
# ORT 约束: directml 与 cuda 互斥 → 各自独立变体 artifact, 不在同一二进制共存。
cuda = ["attune-server/cuda"]
directml = ["attune-server/directml"]
coreml = ["attune-server/coreml"]
openvino = ["attune-server/openvino"]
rocm = ["attune-server/rocm"]
tensorrt = ["attune-server/tensorrt"]
vitis = ["attune-server/vitis"]

[package.metadata.cargo-machete]
ignored = ["serde", "serde_json"]

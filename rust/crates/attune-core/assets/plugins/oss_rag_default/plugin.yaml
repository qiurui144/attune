id: oss-rag-default
name: Attune OSS Default RAG
type: rag_profile_pack
version: "1.5.18"
author: attune-team
category: general
description: Default knowledge-base chat and summary RAG profiles for offline, cloud-only, and edge-scheduler deployments.

prompt_file: prompt.md

rag_profiles:
  - id: default_kb_chat
    intents: [chat.rag.lookup, chat.rag.question]
    workflow:
      mode: reliable
      planner:
        max_sub_queries: 4
        preserve_user_terms: true
      clarification:
        enabled: true
        require_when_multiple_scopes: true
        scope_terms: []
      evidence:
        max_evidence_tokens: 1600
        include_breadcrumbs: true
        chunk_kind_priority: [ApiReference, Procedure, CommandBlock, ConfigBlock]
      verification:
        min_grounding_confidence: 0.70
        max_repair_attempts: 1
    retrieval:
      strategy: source_diverse_cited_chunks
      fallback_when_empty: refuse
      top_k: 8
    answer:
      task: kb.query.ask
      model_class: rag-chat
      preferred_size: 30B
      fallback_sizes: [14B, 70B, cloud]
      sync_sla_ms: 8000
      realtime_poll: true
    grounding:
      min_citations: 1
      refuse_without_evidence: true
      allow_extractive_repair: true
  - id: default_kb_diagnostic
    intents: [chat.rag.diagnostic, chat.rag.procedure, chat.rag.troubleshooting]
    workflow:
      mode: reliable
      planner:
        max_sub_queries: 5
        preserve_user_terms: true
      clarification:
        enabled: true
        require_when_multiple_scopes: true
        scope_terms: []
      evidence:
        max_evidence_tokens: 1800
        include_breadcrumbs: true
        chunk_kind_priority: [Troubleshooting, Procedure, CommandBlock, ConfigBlock]
      verification:
        min_grounding_confidence: 0.72
        max_repair_attempts: 1
    retrieval:
      strategy: expanded_diagnostic_cited_chunks
      fallback_when_empty: refuse
      top_k: 8
    answer:
      task: kb.query.ask
      model_class: rag-chat
      preferred_size: 30B
      fallback_sizes: [14B, 70B, cloud]
      sync_sla_ms: 30000
      realtime_poll: true
    grounding:
      min_citations: 1
      refuse_without_evidence: true
      allow_extractive_repair: false
  - id: default_kb_summary
    intents: [chat.rag.summary, document.summary]
    workflow:
      mode: reliable
      planner:
        max_sub_queries: 5
        preserve_user_terms: true
      clarification:
        enabled: true
        require_when_multiple_scopes: true
        scope_terms: []
      evidence:
        max_evidence_tokens: 2200
        include_breadcrumbs: true
        chunk_kind_priority: [Section, Paragraph, ApiReference, Procedure]
      verification:
        min_grounding_confidence: 0.68
        max_repair_attempts: 1
    retrieval:
      strategy: recent_or_source_diverse_cited_chunks
      fallback_when_empty: refuse
      top_k: 12
    answer:
      task: kb.query.ask
      model_class: rag-summary
      preferred_size: 30B
      fallback_sizes: [14B, 70B, cloud]
      sync_sla_ms: 30000
      realtime_poll: true
    grounding:
      min_citations: 1
      refuse_without_evidence: true
      allow_extractive_repair: false
